[build]
  publish = "public"
  command = "echo 'Deploying public directory'"

[dev]
  framework = "#static"
  publish = "public"

[[redirects]]
  from = "/*"
  to = "/mock_sites/portal.html"
  status = 200

# Proxy rule to allow CORS-free API calls if we add backend functions later
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
