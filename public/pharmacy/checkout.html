<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernPharmacy - Checkout</title>
    <style>
        :root { --primary: #059669; --bg: #f8fafc; }
        body { font-family: sans-serif; background: var(--bg); padding: 2rem; display: flex; justify-content: center; }
        form { background: white; padding: 2rem; border-radius: 0.5rem; width: 100%; max-width: 400px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; border-radius: 0.25rem; box-sizing: border-box; }
        button { background: var(--primary); color: white; width: 100%; padding: 0.75rem; border: none; border-radius: 0.25rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <form action="confirmation.html" method="GET">
        <h2 style="margin-top: 0; color: var(--primary);">Secure Checkout</h2>
        
        <label>Full Name</label>
        <input type="text" name="name" required placeholder="John Doe">
        
        <label>Shipping Address</label>
        <input type="text" name="address" required placeholder="123 Wellness Ave">
        
        <label>Credit Card</label>
        <input type="text" placeholder="**** **** **** 1234" disabled style="background: #f1f5f9;">
        
        <button type="submit">Place Order ($15.00)</button>
    </form>
</body>
</html>
